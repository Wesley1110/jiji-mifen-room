<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小房間・家具配置預覽</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f0e7;color:#654f40;font:15px/1.8 "Microsoft JhengHei",sans-serif}main{max-width:1120px;margin:42px auto;padding:0 28px}small{letter-spacing:.13em;color:#9b7d69}h1{font-size:29px;margin:3px 0 8px;font-weight:650}p{margin:0 0 22px;color:#8a7464}.layout{display:grid;grid-template-columns:1.5fr 1fr;gap:32px;align-items:center}.plan{background:#fffaf3;border:1px solid #e8d9c6;border-radius:28px;padding:12px;box-shadow:0 12px 35px #78533408}svg{display:block;width:100%;height:auto}svg text{font-family:inherit;fill:#6c5543}button{font:inherit;text-align:left;width:100%;border:1px solid #e1d1bf;border-radius:19px;padding:18px 20px;background:#fffaf4;cursor:pointer;color:inherit;margin-bottom:12px}button.active{border-color:#c88e7b;background:#f6e3d8;box-shadow:0 4px 20px #9b654710}button strong{display:block;font-size:17px}button span{display:block;color:#927968;font-size:13px;margin-top:5px}.badge{display:inline-block!important;font-size:10px!important;border-radius:20px;background:#eadacc;padding:2px 10px;margin:0 0 7px!important}.foot{font-size:12px;margin-top:16px}a{color:#84664d;text-decoration:none;border-bottom:1px solid #be9c7d}a.primary{display:block;background:#926d52;color:#fff7eb;padding:12px 18px;border-radius:13px;text-align:center;border:0;margin-top:19px}.feature{transition:opacity .25s}.muted{opacity:.32}.selected rect{stroke-width:3}.planned{stroke-dasharray:8 5}.legend{display:flex;gap:18px;font-size:12px;justify-content:center;margin:3px 0 10px}.swatch{display:inline-block;width:15px;height:10px;margin-right:6px;border:1px solid #b99472;background:#eacfa5}.swatch.dash{background:#f1dfd1;border-style:dashed}.swatch.lane{background:#d9e1cb;border-color:#a4b38a}@media(max-width:760px){main{margin:22px auto;padding:0 18px}.layout{grid-template-columns:1fr;gap:20px}h1{font-size:24px}button{padding:14px 18px}}
</style></head><body><main><small>雞雞與米粉 · 家具配置預覽</small><h1>留出走道，也留一個寫字的小角落。</h1><p>先完成書桌椅。抽屜櫃與床頭櫃保留位置，等你確認造型後再加入。</p>
<div class="layout"><div class="plan"><svg id="plan" viewBox="0 0 820 740" role="img" aria-label="房間俯視圖：書桌在左側床尾，抽屜櫃預留於左前方，新床頭櫃在床頭左側，右側原有床頭櫃保留，門在下方，窗在右方"></svg><div class="legend"><span><i class="swatch"></i>這次製作</span><span><i class="swatch dash"></i>預留</span><span><i class="swatch lane"></i>主要走道</span></div></div>
<div><button class="active" data-target="desk"><span class="badge">這次製作 · 01</span><strong>愛心書桌椅</strong><span>床左側靠牆、偏床尾。椅子朝房間中央拉出，避開熊熊地毯的臉；桌面採暖木色與粉紅文具。</span></button><button data-target="dresser"><span class="badge">預留位置 · 02</span><strong>花朵抽屜櫃</strong><span>左前方、房門左邊的牆面。採參考圖中的矮抽屜櫃比例，與門片及中央走道保持距離。</span></button><button data-target="nightstand"><span class="badge">預留位置 · 03</span><strong>左側新增花語床頭櫃</strong><span>從房門往床頭看，新增在床頭左側、熊熊地毯後方。右側原有床頭櫃完整保留，不移動、不替換。</span></button><a class="primary" href="./?view=desk">進房間看書桌椅 →</a><p class="foot">俯視配置示意依目前場景座標繪製，並非施工尺寸圖。虛線家具尚未製作。可點三張卡片查看各區位置。</p></div></div></main>
<script>
const svg=document.getElementById('plan'),X=x=>66+(x+10.65)*45,Z=z=>64+(z+3.2)*45;
const rect=(x0,z0,x1,z1,fill,stroke='#c7a982',extra='')=>`<rect x="${X(x0)}" y="${Z(z0)}" width="${(x1-x0)*45}" height="${(z1-z0)*45}" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="2" ${extra}/>`;
const text=(x,z,t,size=14)=>`<text x="${X(x)}" y="${Z(z)}" font-size="${size}" text-anchor="middle">${t}</text>`;
const circle=(x,z,r,fill)=>`<circle cx="${X(x)}" cy="${Z(z)}" r="${r*45}" fill="${fill}"/>`;
svg.innerHTML=`<defs><pattern id="floor" width="70" height="35" patternUnits="userSpaceOnUse"><rect width="70" height="35" fill="#fbf2e5"/><path d="M0 35H70 M35 0V35" stroke="#eee0cd" fill="none"/></pattern><pattern id="pink" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f7e1d4"/><path d="M0 4H16 M4 0V16" stroke="#dfaaa0" stroke-width="7" opacity=".38"/></pattern></defs>
${rect(-10.35,-2.95,5.15,10.02,'url(#floor)','#b49776')}
${rect(-2.9,-2.65,2.9,3.93,'#e4b9ab')}${rect(-2.62,-2.4,2.62,-.8,'#f7dfcc')}${text(0,.8,'雞雞與米粉的床',18)}${text(0,1.5,'原有家具')}
${circle(-8.35,-.4,.72,'#ead2ac')}${circle(-4.95,-.4,.72,'#ead2ac')}<ellipse cx="${X(-6.65)}" cy="${Z(1.5)}" rx="${2.50*45}" ry="${2.10*45}" fill="#ead2ac" stroke="#d6b991"/>
${text(-6.65,1.65,'熊熊地毯',16)}
<path d="M${X(-3.55)} ${Z(9.9)} L${X(-3.55)} ${Z(4.7)} Q${X(-3.55)} ${Z(3.7)} ${X(-3.5)} ${Z(2.8)}" stroke="#cad7bb" stroke-width="28" stroke-linecap="round" fill="none" opacity=".65"/>
${text(-1.8,6.3,'保留開闊走道',14)}
<g class="feature selected" id="desk">${rect(-10.02,3.825,-8.38,7.375,'#e8c69a')}${rect(-8.12,4.65,-6.88,5.95,'url(#pink)','#c79185')}${text(-9.2,5.85,'01',19)}${text(-7.45,6.42,'椅子',12)}${text(-8.4,7.9,'愛心書桌椅',16)}</g>
<g class="feature" id="dresser">${rect(-9.8,8.5,-6.3,9.75,'#f0dfd2','#bf9f83','class="planned"')}${text(-8.05,9.13,'02 抽屜櫃',15)}${text(-8.05,9.5,'預留',11)}</g>
<g class="feature" id="nightstand">${rect(-4.75,-2.50,-3.10,-1.10,'#f0dfd2','#bf9f83','class="planned"')}${text(-3.925,-1.95,'03',17)}${text(-3.925,-1.45,'左側新增',11)}</g>
<g id="existing-nightstand">${rect(2.91,-1.64,4.13,-.66,'#e4caaa')}${text(3.52,-1.03,'保留',12)}${text(3.52,-.15,'原有床頭櫃',11)}</g>
<path d="M${X(5.15)} ${Z(-1.23)}V${Z(2.43)}" stroke="#8caebb" stroke-width="8"/>${text(5.7,.8,'右窗',14)}
<path d="M${X(-4.39)} ${Z(10.02)}H${X(-2.71)}" stroke="#fffaf3" stroke-width="10"/><path d="M${X(-4.39)} ${Z(10.02)}V${Z(8.34)} M${X(-4.39)} ${Z(8.34)} A${1.68*45} ${1.68*45} 0 0 1 ${X(-2.71)} ${Z(10.02)}" stroke="#b19372" stroke-width="2" fill="none"/>${text(-3.55,10.8,'房門 → 走廊',15)}
${text(-2.6,-3.55,'床頭這一側',13)}`;
document.querySelectorAll('[data-target]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-target]').forEach(c=>c.classList.toggle('active',b===c));document.querySelectorAll('.feature').forEach(g=>{g.classList.toggle('selected',g.id===b.dataset.target);g.classList.toggle('muted',g.id!==b.dataset.target);});});
</script></body></html>
